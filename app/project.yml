# XcodeGen project definition - the source of truth for the Xcode project.
# BrewUpdates.xcodeproj is generated from this file and is not committed.
# Regenerate after adding/removing files or changing settings:
#   cd app && xcodegen generate
name: BrewUpdates

options:
  bundleIdPrefix: com.jxman
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  # Marks the project as reviewed by this Xcode, so it doesn't show "Update to recommended
  # settings". When Xcode is upgraded and shows it again, add the settings it recommends
  # below and bump this, rather than clicking "Perform Changes" (regeneration would undo it).
  xcodeVersion: "27.1"

# Swift packages. Sparkle checks for, downloads and installs app updates (State/AppUpdater.swift).
# An exact version, so a build never picks up a new release unnoticed
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Ad-hoc "Sign to Run Locally" - no Apple developer account needed for a personal app
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Recommended by Xcode 27; only matters once the app has String Catalogs
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  BrewUpdates:
    type: application
    platform: macOS
    sources:
      - path: BrewUpdates
      # The update script, copied into the app's Resources so the app and script ship as a
      # matched pair. The app installs it at launch (ScriptInstaller); one source file in the repo root
      - path: ../brew-updates.sh
        buildPhase: resources
    # brew-updates-launcher (Launcher/), embedded in Contents/MacOS. The app installs it next to
    # the script and the LaunchAgent runs it, so the job is attributed to the app
    dependencies:
      - package: Sparkle
      - target: BrewUpdatesLauncher
        embed: true
        copy:
          destination: executables
    # Extra Info.plist keys, merged with the generated ones. XcodeGen writes this file on
    # `xcodegen generate` (it's gitignored).
    info:
      path: BrewUpdates/App/Info.plist
      properties:
        # Registers brewupdates:// links (clicking a notification opens its run through one)
        CFBundleURLTypes:
          - CFBundleURLName: com.jxman.BrewUpdates
            CFBundleURLSchemes:
              - brewupdates
        # Sparkle (State/AppUpdater.swift). The appcast is uploaded with each GitHub release, so
        # "latest" always describes the newest release (scripts/release.sh writes it)
        SUFeedURL: https://github.com/jxman/brew-updates/releases/latest/download/appcast.xml
        # Updates must be signed with the matching private key, which is in the release
        # Mac's login keychain (account "brew-updates", made by Sparkle's generate_keys)
        SUPublicEDKey: CxmVs+MwJvoppVlCcFG4rUPs2GIlrIPmn+dGdeoGaSU=
        # Check daily without first asking; Settings > About turns it off
        SUEnableAutomaticChecks: true
        # Check the signature before unpacking a download, not after
        SUVerifyUpdateBeforeExtraction: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jxman.BrewUpdates
        PRODUCT_NAME: Brew Updates
        # Resources/Assets.xcassets/AppIcon, generated from Icon/AppIcon.svg by Icon/make-icon.sh
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Keep the Swift module name space-free for `@testable import BrewUpdates`
        PRODUCT_MODULE_NAME: BrewUpdates
        # Bump for each release: 1.1.0 for features, 1.0.1 for fixes (see CHANGELOG.md)
        MARKETING_VERSION: 1.9.0
        # 0 marks a development build; scripts/install-app.sh sets the git commit count
        CURRENT_PROJECT_VERSION: 0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Brew Updates
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # The app must read ~/.brew_logs, run brew and launchctl - not possible inside the App Sandbox
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        # Apple silicon only: macOS 26 is the last release for Intel Macs
        ARCHS: arm64
      configs:
        # Notarization requires the hardened runtime. Debug stays without it so day-to-day
        # development is unchanged; install-app.sh and release.sh sign with it as well
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  # What the LaunchAgent runs: execs /bin/bash with its arguments (Launcher/main.swift)
  BrewUpdatesLauncher:
    type: tool
    platform: macOS
    sources:
      - path: Launcher
    settings:
      base:
        PRODUCT_NAME: brew-updates-launcher
        PRODUCT_BUNDLE_IDENTIFIER: com.jxman.BrewUpdates.launcher
        ENABLE_HARDENED_RUNTIME: NO
        ARCHS: arm64
        SKIP_INSTALL: YES
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES

  # Tests compile the UI-free Models and Services code directly instead of running inside
  # the app ("hosted" tests). A menu bar app never quits on its own, so a hosted test run
  # would hang after the tests finish; unhosted tests are also faster.
  BrewUpdatesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BrewUpdatesTests
      - path: BrewUpdates/Models
      - path: BrewUpdates/Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jxman.BrewUpdatesTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BrewUpdates:
    build:
      targets:
        BrewUpdates: all
        BrewUpdatesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BrewUpdatesTests
